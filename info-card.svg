    <text x="0" y="0" fill="#6e7681" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="12px" font-weight="600">  STATUS</text>
    <circle cx="118" cy="-4" r="4" fill="#3fb950"/>
    <text x="130" y="0" fill="#3fb950" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="13px" font-weight="600">Open to Opportunities</text>
  </g>

  <!-- Focus -->
  <g transform="translate(20, 226)">
    <text x="0" y="0" fill="#6e7681" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="12px" font-weight="600">  FOCUS</text>
    <text x="110" y="0" fill="#bc8cff" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="12.5px" font-weight="600">Safety Tech · Web · Mobile</text>
