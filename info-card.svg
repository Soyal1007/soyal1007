    <text x="0" y="0" fill="#6e7681" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="12px" font-weight="600">  ROLE</text>
    <text x="110" y="0" fill="#00f2fe" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="13px" font-weight="600">Full-Stack &amp; Systems Dev</text>
  </g>

  <!-- Location -->
  <g transform="translate(20, 170)">
    <text x="0" y="0" fill="#6e7681" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="12px" font-weight="600">  BASED</text>
    <text x="110" y="0" fill="#3fb950" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="13px" font-weight="600">India 🌏</text>
  </g>

