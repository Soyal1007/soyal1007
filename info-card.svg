<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 520" width="480" height="520">
  <defs>
    <linearGradient id="accent-gold-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#3fb950" />
      <stop offset="100%" stop-color="#ffd700" />
    </linearGradient>

    <style>
      @keyframes blink {
        50% { opacity: 0; }
      }
    </style>
  </defs>

  <!-- Container Box -->
  <rect width="480" height="520" x="0" y="0" fill="#090d16" rx="14" ry="14" stroke="#30363d" stroke-width="1.5" />

  <!-- Header Bar -->
  <path d="M 0 14 C 0 6.27 6.27 0 14 0 L 466 0 C 473.73 0 480 6.27 480 14 L 480 38 L 0 38 Z" fill="#161b22" />
  <line x1="0" y1="38" x2="480" y2="38" stroke="#30363d" stroke-width="1" />

  <!-- Terminal Window Controls -->
  <circle cx="22" cy="19" r="5" fill="#ff5f56" />
  <circle cx="38" cy="19" r="5" fill="#ffbd2e" />
  <circle cx="54" cy="19" r="5" fill="#27c93f" />

  <!-- Header Title -->
  <text x="240.0" y="23" text-anchor="middle" fill="#8b949e" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="11.5px" font-weight="600">developer_profile.sh</text>

  <!-- Command Line Prompt -->
  <g transform="translate(24, 70)">
    <text x="0" y="0" fill="#00f2fe" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="13px" font-weight="700">soyal1007</text>
    <text x="78" y="0" fill="#f0f6fc" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="13px" font-weight="600">@github:~$ whoami --verbose</text>
  </g>

  <!-- Accent Divider -->
  <line x1="24" y1="84" x2="456" y2="84" stroke="url(#accent-gold-cyan)" stroke-width="1.5" stroke-dasharray="4 2" />

  <!-- Developer Attributes Grid (Inline Attributes for Guaranteed GitHub Rendering) -->
  <!-- Name -->
  <g transform="translate(24, 120)">
    <text x="0" y="0" fill="#8b949e" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="13px" font-weight="600">👤 Name:</text>
    <text x="130" y="0" fill="#ffd700" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="13px" font-weight="700">Soyal</text>
  </g>

  <!-- Role -->
  <g transform="translate(24, 158)">
    <text x="0" y="0" fill="#8b949e" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="13px" font-weight="600">⚡ Role:</text>
    <text x="130" y="0" fill="#00f2fe" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="13px" font-weight="600">Full-Stack &amp; Systems Dev</text>
  </g>

  <!-- Focus -->
  <g transform="translate(24, 196)">
    <text x="0" y="0" fill="#8b949e" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="13px" font-weight="600">🎯 Focus:</text>
    <text x="130" y="0" fill="#3fb950" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="13px" font-weight="600">Safety Platforms &amp; Web Apps</text>
  </g>

  <!-- Languages -->
  <g transform="translate(24, 234)">
    <text x="0" y="0" fill="#8b949e" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="13px" font-weight="600">💻 Stack:</text>
    <text x="130" y="0" fill="#bc8cff" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="13px" font-weight="600">Python, JavaScript, TypeScript, Dart</text>
  </g>

  <!-- Frameworks -->
  <g transform="translate(24, 272)">
    <text x="0" y="0" fill="#8b949e" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="13px" font-weight="600">🚀 Frameworks:</text>
    <text x="130" y="0" fill="#f0f6fc" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="13px" font-weight="500">Flutter, React, Next.js</text>
  </g>

  <!-- Location -->
  <g transform="translate(24, 310)">
    <text x="0" y="0" fill="#8b949e" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="13px" font-weight="600">📍 Location:</text>
    <text x="130" y="0" fill="#ffd700" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="13px" font-weight="700">India</text>
  </g>

  <!-- Featured Highlights -->
  <g transform="translate(24, 356)">
    <text x="0" y="0" fill="#8b949e" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="13px" font-weight="600">🌟 Highlight:</text>
    <rect x="130" y="-15" width="146" height="23" fill="#161b22" stroke="#ffd700" stroke-width="1.2" rx="6" ry="6" />
    <text x="138" y="0" fill="#ffd700" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="11.5px" font-weight="700">RAKSHAK / SafeHer</text>
  </g>

  <g transform="translate(24, 396)">
    <text x="0" y="0" fill="#8b949e" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="13px" font-weight="600">📦 Utilities:</text>
    <rect x="130" y="-15" width="110" height="23" fill="#161b22" stroke="#00f2fe" stroke-width="1.2" rx="6" ry="6" />
    <text x="138" y="0" fill="#00f2fe" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="11.5px" font-weight="700">smart-print</text>
  </g>

  <!-- Terminal Status Footer -->
  <line x1="24" y1="436" x2="456" y2="436" stroke="#30363d" stroke-width="1" />

  <g transform="translate(24, 472)">
    <text x="0" y="0" fill="#3fb950" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="13px" font-weight="700">SYSTEM READY.</text>
    <text x="130" y="0" fill="#f0f6fc" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="13px" font-weight="500">Listening for events...</text>
    <rect x="325" y="-11" width="8" height="15" fill="#00f2fe" style="animation: blink 1s step-end infinite;" />
  </g>

