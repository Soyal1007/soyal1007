  <rect width="520" height="540" rx="16" ry="16" fill="url(#ic-bg)" stroke="#1e2d3d" stroke-width="1.5"/>

  <!-- Header Bar -->
  <path d="M0 16 Q0 0 16 0 L504 0 Q520 0 520 16 L520 38 L0 38Z" fill="#0d1117"/>
  <line x1="0" y1="38" x2="520" y2="38" stroke="#21262d" stroke-width="1"/>

  <!-- Window dots -->
  <circle cx="20" cy="19" r="5.5" fill="#ff5f56"/>
  <circle cx="37" cy="19" r="5.5" fill="#ffbd2e"/>
  <circle cx="54" cy="19" r="5.5" fill="#27c93f"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle"
    fill="#6e7681" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="11px" font-weight="600">developer_profile.sh — bash</text>

  <!-- Prompt line -->
  <g transform="translate(20, 64)">
    <text x="0" y="0" fill="#00f2fe" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="13px" font-weight="700">soyal1007</text>
    <text x="82" y="0" fill="#3fb950" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="13px" font-weight="600">@github</text>
    <text x="147" y="0" fill="#8b949e" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="13px">:~$</text>
    <text x="183" y="0" fill="#f0f6fc" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="13px" font-weight="500"> whoami --full</text>
    <rect x="323" y="-13" width="9" height="16" fill="#00f2fe" style="animation: blink 1.1s step-end infinite;"/>
  </g>

  <!-- Divider 1 -->
  <line x1="20" y1="82" x2="500" y2="82" stroke="url(#ic-div)" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Name -->
  <g transform="translate(20, 114)">
    <text x="0" y="0" fill="#6e7681" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="12px" font-weight="600">  NAME</text>
    <text x="110" y="0" fill="#ffd700" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="13px" font-weight="700">Soyal</text>
  </g>

