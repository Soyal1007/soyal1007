  <rect x="20" y="280" width="68" height="22" rx="5" ry="5" fill="#003153" stroke="#00f2fe" stroke-width="1.2"/>
  <text x="30" y="295" fill="#00f2fe" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="11px" font-weight="700">Python</text>
  <rect x="96" y="280" width="100" height="22" rx="5" ry="5" fill="#1a0a2e" stroke="#bc8cff" stroke-width="1.2"/>
  <text x="106" y="295" fill="#bc8cff" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="11px" font-weight="700">JavaScript</text>
  <rect x="204" y="280" width="100" height="22" rx="5" ry="5" fill="#1a2000" stroke="#3fb950" stroke-width="1.2"/>
  <text x="214" y="295" fill="#3fb950" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="11px" font-weight="700">TypeScript</text>
  <rect x="312" y="280" width="52" height="22" rx="5" ry="5" fill="#2a1a00" stroke="#ffd700" stroke-width="1.2"/>
  <text x="322" y="295" fill="#ffd700" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="11px" font-weight="700">Dart</text>
  <rect x="372" y="280" width="44" height="22" rx="5" ry="5" fill="#1a001a" stroke="#e040fb" stroke-width="1.2"/>
  <text x="382" y="295" fill="#e040fb" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="11px" font-weight="700">C++</text>

  <!-- Frameworks section -->
  <text x="20" y="350" fill="#8b949e" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="11px" font-weight="700" letter-spacing="2">FRAMEWORKS &amp; TOOLS</text>
  <rect x="20" y="362" width="76" height="22" rx="5" ry="5" fill="#003153" stroke="#00bcd4" stroke-width="1.2"/>
  <text x="30" y="377" fill="#00bcd4" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="11px" font-weight="700">Flutter</text>
  <rect x="104" y="362" width="60" height="22" rx="5" ry="5" fill="#1a001a" stroke="#e040fb" stroke-width="1.2"/>
  <text x="114" y="377" fill="#e040fb" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="11px" font-weight="700">React</text>
  <rect x="172" y="362" width="76" height="22" rx="5" ry="5" fill="#001a00" stroke="#69f0ae" stroke-width="1.2"/>
  <text x="182" y="377" fill="#69f0ae" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="11px" font-weight="700">Next.js</text>
  <rect x="256" y="362" width="76" height="22" rx="5" ry="5" fill="#1a1200" stroke="#ffcc02" stroke-width="1.2"/>
  <text x="266" y="377" fill="#ffcc02" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="11px" font-weight="700">Node.js</text>

  <!-- Bottom border line -->
  <line x1="20" y1="508" x2="500" y2="508" stroke="#21262d" stroke-width="1"/>

  <!-- Footer -->
  <text x="20" y="526" fill="#3fb950" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="11px" font-weight="700">● SYSTEM READY</text>
  <text x="500" y="526" text-anchor="end" fill="#3d444d" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="11px">github.com/Soyal1007</text>

