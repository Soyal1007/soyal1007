<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 520" width="480" height="520">
  <defs>
    <!-- Multi-Tone Gradient Fill -->
    <linearGradient id="portrait-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="35%" stop-color="#4facfe" />
      <stop offset="70%" stop-color="#ffd700" />
      <stop offset="100%" stop-color="#bc8cff" />
    </linearGradient>

    <!-- Scanline Glow Gradient -->
    <linearGradient id="scan-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(0, 242, 254, 0.0)" />
      <stop offset="50%" stop-color="rgba(0, 242, 254, 0.22)" />
      <stop offset="100%" stop-color="rgba(0, 242, 254, 0.0)" />
    </linearGradient>

    <style>
      @keyframes pulseShine {
        0% { filter: drop-shadow(0 0 1px rgba(0, 242, 254, 0.4)); }
        50% { filter: drop-shadow(0 0 5px rgba(255, 215, 0, 0.6)); }
        100% { filter: drop-shadow(0 0 2px rgba(188, 140, 255, 0.5)); }
      }

      @keyframes sweepMotion {
        0% { transform: translateY(0px); opacity: 0.3; }
        50% { opacity: 0.8; }
        100% { transform: translateY(450px); opacity: 0.3; }
      }
    </style>
  </defs>

  <!-- Container Box -->
  <rect width="480" height="520" x="0" y="0" fill="#090d16" rx="14" ry="14" stroke="#30363d" stroke-width="1.5" />

  <!-- Terminal Header Bar -->
  <path d="M 0 14 C 0 6.27 6.27 0 14 0 L 466 0 C 473.73 0 480 6.27 480 14 L 480 38 L 0 38 Z" fill="#161b22" />
  <line x1="0" y1="38" x2="480" y2="38" stroke="#30363d" stroke-width="1" />

  <!-- Terminal Window Controls -->
  <circle cx="22" cy="19" r="5" fill="#ff5f56" />
  <circle cx="38" cy="19" r="5" fill="#ffbd2e" />
  <circle cx="54" cy="19" r="5" fill="#27c93f" />

  <!-- Header Title -->
  <text x="240.0" y="23" text-anchor="middle" fill="#8b949e" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="11.5px" font-weight="600">soyal1007@github:~$ cat ascii_portrait.txt</text>

  <!-- Scanline Overlay -->
  <rect x="2" y="39" width="476" height="50" fill="url(#scan-glow)" pointer-events="none" style="animation: sweepMotion 5s ease-in-out infinite;" />

