  <text x="240.0" y="23" text-anchor="middle" fill="#8b949e" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="11.5px" font-weight="600">soyal1007@github:~$ cat portrait_matrix.txt</text>

